[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv7-kernels"
version = "0.10.0.dev0"
description = "Optional optimized operator backends for rwkv7-hf"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch"]

[tool.setuptools.packages.find]
include = ["rwkv7_kernels*"]
